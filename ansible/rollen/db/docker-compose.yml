services:
  db:
    image: mysql:8.0
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: hallo
      MYSQL_USER: hallo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

volumes:
  db_data: {}
