---
- name: Backend einrichten
  hosts: backendserver
  become: true

  vars:
    pfad: /home/ubuntu/backend

  tasks:
    - name: Verzeichnis anlegen
      file:
        path: "{{ pfad }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Dateien kopieren
      copy:
        src: "rollen/backend/{{ item }}"
        dest: "{{ pfad }}/{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      loop:
        - docker-compose.yml
        - Caddyfile

    - name: .env ausrollen
      copy:
        src: files/env.vault
        dest: "{{ pfad }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        decrypt: true

    - name: Image-Archiv übertragen
      copy:
        src: files/images/app-1.0.tar.gz
        dest: /tmp/app-1.0.tar.gz
        mode: "0644"
      register: archiv

    - name: Prüfen ob Images vorhanden
      command: docker image inspect hallo-app:1.0
      register: vorhanden
      failed_when: false
      changed_when: false
      become_user: ubuntu

    - name: Images laden
      shell: gunzip -c /tmp/app-1.0.tar.gz | docker load
      become_user: ubuntu
      when: vorhanden.rc != 0 or archiv.changed

    - name: Archiv aufräumen
      file:
        path: /tmp/app-1.0.tar.gz
        state: absent

    - name: Container starten
      command:
        cmd: docker compose up -d
        chdir: "{{ pfad }}"
      become_user: ubuntu
